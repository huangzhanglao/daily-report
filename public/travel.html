<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 旅游规划</title>
<style>
  :root{
    --bg:#f4f8fb; --panel:#ffffff; --ink:#1c2733; --soft:#56657a; --faint:#94a3b8;
    --line:#e6edf4; --brand:#0ea5e9; --brand-2:#22d3ee; --brand-soft:#e3f5fd;
    --ok:#16a34a; --warn:#d97706; --err:#ef4444; --ok-soft:#e8f8ef; --err-soft:#fdeeee;
    --radius:16px; --shadow:0 1px 2px rgba(20,40,80,.05),0 12px 30px rgba(20,40,80,.07);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:14px; color:var(--ink);}
  .wrap{max-width:880px; margin:0 auto; padding:0 14px 120px;}

  .topbar{position:sticky; top:0; z-index:40; background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#fff;
    padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);}
  .topbar .back{border:none; background:rgba(255,255,255,.2); color:#fff; width:34px; height:34px; border-radius:10px; font-size:18px; display:grid; place-items:center;}
  .topbar .back:hover{background:rgba(255,255,255,.32);}
  .topbar h1{font-size:17px; margin:0; font-weight:700; display:flex; align-items:center; gap:8px;}
  .topbar .spacer{flex:1;}
  .topbar .who{font-size:12px; opacity:.94; background:rgba(255,255,255,.2); padding:5px 11px; border-radius:999px; white-space:nowrap;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:14px; box-shadow:var(--shadow);}
  .card h2{font-size:14px; margin:0 0 12px; color:var(--soft); font-weight:700; display:flex; align-items:center; gap:7px;}
  .card h2 .ic{font-size:16px;}
  .hint{font-size:12px; color:var(--faint); margin-top:6px;}
  .toolbar{font-size:12px; color:var(--soft); background:var(--brand-soft); border:1px solid #cdeefb; border-radius:11px; padding:9px 12px; margin-top:12px; line-height:1.7;}
  .toolbar b{color:var(--brand);}
  .tool-on{color:var(--ok); font-weight:700;}
  .tool-off{color:var(--warn); font-weight:700;}

  .form-row{margin-bottom:12px;}
  .form-row label{display:block; font-size:12px; color:var(--soft); font-weight:600; margin-bottom:5px;}
  .form-row textarea{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:11px; resize:vertical; min-height:88px; line-height:1.55;}
  .form-row textarea.extra{min-height:60px;}
  .form-row textarea:focus,.form-row input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft);}

  .genbtn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; border:none; border-radius:13px;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee); color:#fff; font-size:15px; font-weight:700; box-shadow:0 8px 20px rgba(14,165,233,.35);}
  .genbtn:hover{filter:brightness(1.05);}
  .genbtn:disabled{opacity:.6; cursor:not-allowed; box-shadow:none;}
  .genbtn .spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}

  .steps{display:none; margin-top:14px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .steps.show{display:block;}
  .steps .st-title{font-size:13px; color:var(--soft); margin-bottom:12px; font-weight:700;}
  .st{display:flex; align-items:center; gap:10px; padding:7px 0; color:var(--faint);}
  .st .dot{width:20px; height:20px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:11px; color:#fff; flex:none;}
  .st .lb{font-size:13px; flex:1;}
  .st.pending .lb{color:var(--faint);}
  .st.running{color:var(--ink);} .st.running .lb{color:var(--brand); font-weight:600;}
  .st.running .dot{background:var(--brand); animation:pulse 1.2s infinite;}
  .st.done{color:var(--ink);} .st.done .dot{background:var(--ok);}
  .st.done .lb{color:var(--ink);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .agents{display:inline-flex; gap:6px; margin-left:4px; vertical-align:middle;}
  .agent{font-size:11px; padding:2px 9px; border-radius:999px; background:var(--line); color:var(--faint); border:1px solid var(--line); transition:all .2s; white-space:nowrap;}
  .agent.running{background:var(--brand-soft); color:var(--brand); border-color:#cdeefb;}
  .agent.done{background:var(--ok-soft); color:var(--ok); border-color:#cdeccd;}

  .result{display:none;}
  .result.show{display:block;}
  .res-head{display:flex; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .res-head .rt{font-size:16px; font-weight:800; flex:1; min-width:120px; word-break:break-all;}
  .res-tab{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:3px; margin-top:12px; flex-wrap:wrap;}
  .res-tab button{border:none; background:transparent; padding:7px 13px; border-radius:9px; font-size:13px; color:var(--soft); font-weight:600;}
  .res-tab button.active{background:var(--brand); color:#fff;}
  .res-body{margin-top:12px;}
  .docbox{display:none; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:18px; box-shadow:var(--shadow); white-space:pre-wrap; word-break:break-word; line-height:1.75; font-size:14px; min-height:120px;}
  .docbox.show{display:block;}
  .docbox .ttl{font-size:12px; color:var(--faint); margin-bottom:8px; font-weight:600;}
  .sub{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); background:var(--panel);}
  .sub .h{font-size:13px; font-weight:700; color:var(--brand); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .sub .body{white-space:pre-wrap; word-break:break-word; line-height:1.7; font-size:13.5px;}

  .actbar{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .btn{padding:9px 15px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--soft); font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{border-color:var(--brand); color:var(--brand);}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
  .btn.primary:hover{filter:brightness(1.05);}
  .btn.danger{color:var(--err);} .btn.danger:hover{border-color:var(--err); color:var(--err); background:var(--err-soft);}
  .btn:disabled{opacity:.55; cursor:not-allowed;}

  .his-title{margin-top:22px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700; color:var(--soft);}
  .his-title .cnt{font-size:12px; color:var(--faint); font-weight:400;}
  .his-list{margin-top:8px;}
  .his-item{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .15s;}
  .his-item:hover{border-color:var(--brand);}
  .his-item .ic{width:36px; height:36px; border-radius:10px; background:var(--brand-soft); display:grid; place-items:center; font-size:17px; flex:none;}
  .his-item .mid{flex:1; min-width:0;}
  .his-item .mid .t{font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .his-item .mid .n{font-size:12px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .his-item .del{border:none; background:transparent; color:var(--faint); font-size:17px; padding:4px 8px; border-radius:8px; flex:none;}
  .his-item .del:hover{background:var(--err-soft); color:var(--err);}
  .empty{color:var(--faint); text-align:center; padding:26px 10px; font-size:13px;}

  .toast{position:fixed; left:50%; bottom:calc(40px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); background:rgba(30,30,50,.92); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; z-index:99; opacity:0; pointer-events:none; transition:all .25s; max-width:86vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media(max-width:560px){
    .res-tab button{flex:1;}
    .docbox{padding:14px 12px; font-size:13.5px;}
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="back" onclick="goHome()">←</button>
  <h1>🧳 AI 旅游规划</h1>
  <span class="spacer"></span>
  <span class="who" id="who">…</span>
</header>

<div class="wrap">

  <!-- 规划表单 -->
  <div class="card">
    <h2><span class="ic">🪄</span>一句话，生成你的专属行程</h2>
    <div class="form-row">
      <label>① 你的旅行需求（越具体，行程越贴合）</label>
      <textarea id="prompt" placeholder="例如：10月带爸妈去云南玩7天，预算人均5000，想看洱海和玉龙雪山，节奏轻松一点，爱吃当地美食，交通想坐高铁"></textarea>
    </div>
    <div class="form-row">
      <label>② 补充偏好（可选，会并入上方需求）</label>
      <textarea class="extra" id="extra" placeholder="如：必去xx、不要太多步行、住古城内、想泡温泉…"></textarea>
    </div>
    <div class="toolbar" id="toolbar">实时数据：加载中…</div>
    <button class="genbtn" id="genBtn"><span id="genTxt">✨ 生成行程（多智能体规划中）</span></button>
  </div>

  <!-- 阶段进度 -->
  <div class="steps" id="steps">
    <div class="st-title">智能体规划进度</div>
    <div class="st" id="st1"><span class="dot">1</span><span class="lb">Planner 解析需求 → 结构化旅行计划</span></div>
    <div class="st" id="st2"><span class="dot">2</span><span class="lb">三个专家并行：<span class="agents"><span class="agent" id="ag-attractions">🏞️ 景点</span><span class="agent" id="ag-transport">🚄 交通</span><span class="agent" id="ag-routing">🧭 路线</span></span></span></div>
    <div class="st" id="st3"><span class="dot">3</span><span class="lb">Synthesizer 统筹成逐日行程</span></div>
    <div class="st" id="st4"><span class="dot">4</span><span class="lb">Evaluator 质检门控（缺漏则返工）</span></div>
  </div>

  <!-- 结果区 -->
  <div class="result" id="result">
    <div class="res-head">
      <span class="rt" id="resTitle">🗺️ 行程</span>
      <button class="btn primary" id="copyBtn" style="flex:none">📋 复制行程</button>
    </div>
    <div class="res-tab" id="resTab">
      <button data-v="itinerary" class="active">🗺️ 行程</button>
      <button data-v="experts">🔍 专家分析</button>
      <button data-v="plan">📋 计划 &amp; 质检</button>
    </div>
    <div class="res-body">
      <div class="docbox show" id="boxItinerary"></div>
      <div class="docbox" id="boxExperts">
        <div class="sub"><div class="h">🏞️ 景点推荐</div><div class="body" id="exAttr"></div></div>
        <div class="sub"><div class="h">🚄 交通方案</div><div class="body" id="exTrans"></div></div>
        <div class="sub"><div class="h">🧭 路线编排</div><div class="body" id="exRoute"></div></div>
      </div>
      <div class="docbox" id="boxPlan"></div>
    </div>
    <div class="actbar">
      <button class="btn" id="dlBtn">⬇️ 导出 .txt</button>
      <button class="btn" id="regenBtn">🔁 重新规划一版</button>
      <button class="btn danger" id="delBtn">🗑️ 删除</button>
    </div>
    <div class="hint" id="resMeta"></div>
  </div>

  <!-- 历史列表 -->
  <div class="his-title" id="hisTitle" style="display:none">📚 我的行程 <span class="cnt" id="hisCnt"></span></div>
  <div class="his-list" id="hisList"></div>
  <div class="empty" id="hisEmpty" style="display:none">还没有规划过的行程，从上面生成第一份吧～</div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  function $(id){ return document.getElementById(id); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function api(method, path, body){
    var opts={method:method, headers:{}};
    if(body!==undefined && !(body instanceof FormData)){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(body); }
    else if(body instanceof FormData){ opts.body=body; }
    return fetch(path, opts).then(function(r){ return r.json().then(function(d){return {status:r.status,data:d};}).catch(function(){return {status:r.status,data:{}};}); });
  }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },2300); }
  function goHome(){ location.href="index.html"; }

  var state={ plan_id:null, current:null, busy:false };

  /* ---------- 工具状态 ---------- */
  function loadTools(){
    api("GET","/api/travel/config").then(function(r){
      if(r.status!==200) return;
      var t=r.data.tools||{};
      var amap = t.amap ? '<span class="tool-on">高德 ✅</span>' : '<span class="tool-off">高德 ❌</span>';
      var train= t.train? '<span class="tool-on">12306 ✅</span>' : '<span class="tool-off">12306 ❌</span>';
      $("toolbar").innerHTML="实时数据："+amap+" / "+train+"　·　未接入时基于模型知识生成，并在行程中标注「（模型知识，仅供参考）」";
    });
  }

  /* ---------- 阶段进度 ---------- */
  function setStep(idx,status){
    var el=$("st"+idx); el.className="st "+status;
    if(status==="done") el.querySelector(".dot").textContent="✓";
  }
  function setAgent(agent,status){
    var el=$("ag-"+agent); if(!el) return; el.className="agent "+status;
  }
  function resetAgents(){ ["attractions","transport","routing"].forEach(function(a){ setAgent(a,""); }); }
  function resetSteps(){
    for(var i=1;i<=4;i++){ setStep(i,"pending"); $("st"+i).querySelector(".dot").textContent=i; }
    resetAgents(); $("steps").classList.remove("show");
  }
  function showSteps(){ $("steps").classList.add("show"); resetSteps(); }
  function finishSteps(){ for(var i=1;i<=4;i++) setStep(i,"done"); ["attractions","transport","routing"].forEach(function(a){ setAgent(a,"done"); }); }

  /* ---------- SSE 流式生成（多智能体进度实时推送） ---------- */
  function gen(){
    if(state.busy) return;
    var prompt=$("prompt").value.trim();
    var extra=$("extra").value.trim();
    if(extra) prompt = prompt ? (prompt+"\n"+extra) : extra;
    if(!prompt){ toast("请描述你的旅行需求"); return; }
    state.busy=true; disableGen(true,"规划中…");
    showSteps();
    streamGenerate("/api/travel/generate_stream",{prompt:prompt}, null);
  }
  function regen(){
    if(!state.current || state.busy) return;
    if(!confirm("基于现有需求重新跑一遍多智能体规划？会覆盖当前行程。")) return;
    state.busy=true; showSteps(); resetSteps();
    streamGenerate("/api/travel/plans/"+encodeURIComponent(state.plan_id)+"/regenerate_stream",{}, state.plan_id);
  }
  function streamGenerate(url, body, planId){
    var dec=new TextDecoder(); var buf=""; var doneCount=0;
    fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), credentials:"same-origin"})
      .then(function(r){
        if(r.status!==200){ return r.json().then(function(d){ throw new Error(d.error||("HTTP "+r.status)); }); }
        var reader=r.body.getReader();
        function pump(){
          return reader.read().then(function(res){
            if(res.done) return;
            buf += dec.decode(res.value,{stream:true});
            var frames=buf.split("\n\n"); buf=frames.pop();
            for(var i=0;i<frames.length;i++){
              var line=frames[i].trim();
              if(line.indexOf("data:")===0){ var p=line.slice(5).trim(); if(p){ try{ handleEvent(JSON.parse(p), planId); }catch(e){} } }
            }
            return pump();
          });
        }
        return pump();
      })
      .catch(function(e){ toast(e.message||"网络错误"); enableGen(); });
  }
  function handleEvent(ev, planId){
    if(ev.type==="stage"){
      if(ev.step===2 && ev.agent){
        setAgent(ev.agent, ev.status);
        if(ev.status==="running"){ setStep(2,"running"); }
        else if(ev.status==="done"){ doneCount++; if(doneCount>=3) setStep(2,"done"); }
      } else {
        setStep(ev.step, ev.status);
      }
    } else if(ev.type==="result"){
      finishSteps();
      state.plan_id = planId || ev.id;
      loadDetail(ev.id, true, ev.title);
      loadHistory();
    } else if(ev.type==="error"){
      toast(ev.message||"规划失败"); enableGen();
    }
  }
  function disableGen(dis, txt){ var g=$("genBtn"); g.disabled=dis; g.innerHTML=dis?('<span class="spin"></span><span>'+txt+'</span>') : txt; }
  function enableGen(){ state.busy=false; disableGen(false,"✨ 生成行程"); }

  /* ---------- 结果渲染 ---------- */
  var view="itinerary";
  function bindResTab(){
    var tabs=$("resTab").querySelectorAll("button");
    for(var i=0;i<tabs.length;i++){ tabs[i].onclick=function(){ switchView(this.getAttribute("data-v")); }; }
  }
  function switchView(v){
    view=v;
    var tabs=$("resTab").querySelectorAll("button");
    for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle("active",tabs[i].getAttribute("data-v")===v); }
    $("boxItinerary").classList.toggle("show",v==="itinerary");
    $("boxExperts").classList.toggle("show",v==="experts");
    $("boxPlan").classList.toggle("show",v==="plan");
  }

  function fmtPlan(plan){
    if(!plan||typeof plan!=="object") return "(无计划)";
    var rows=[
      ["目的地", plan.destination],
      ["城市", (plan.cities||[]).join(" → ")],
      ["天数", plan.days],
      ["起止", (plan.start_date||"")+" ~ "+(plan.end_date||"")],
      ["人群", plan.party],
      ["预算", plan.budget],
      ["兴趣", (plan.preferences||[]).join("、")],
      ["必去", (plan.must_see||[]).join("、")],
      ["交通", plan.transport_pref],
      ["节奏", plan.pace],
      ["饮食", plan.food_pref],
      ["备注", plan.notes],
    ];
    var h='<div class="ttl">Planner 解析出的旅行计划</div>';
    rows.forEach(function(r){
      if(r[1]===""||r[1]==null) return;
      h += '<div style="display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)"><div style="width:64px;color:var(--faint);flex:none;font-size:12px">'+(r[0])+'</div><div style="flex:1">'+esc(r[1])+'</div></div>';
    });
    return h;
  }
  function fmtEval(ev){
    if(!ev||typeof ev!=="object") return "";
    var ok = ev.pass!==false;
    var h='<div class="ttl">Evaluator 质检结果</div>';
    h += '<div style="margin:6px 0 10px;font-weight:700;color:'+(ok?'var(--ok)':'var(--warn)')+'">'+(ok?"✅ 校验通过":"⚠️ 建议补充")+'　评分 '+esc(ev.score!=null?ev.score:"-")+'/10</div>';
    if((ev.issues||[]).length){ h+='<div style="font-size:12px;color:var(--soft)">存在问题：</div><div style="white-space:pre-wrap">'+esc((ev.issues||[]).join("\n"))+'</div>'; }
    if((ev.missing||[]).length){ h+='<div style="font-size:12px;color:var(--soft);margin-top:8px">缺失项：</div><div style="white-space:pre-wrap">'+esc((ev.missing||[]).join("\n"))+'</div>'; }
    return h;
  }

  function loadDetail(id, jump, fallbackTitle){
    api("GET","/api/travel/plans/"+encodeURIComponent(id)).then(function(r){
      if(r.status!==200){ toast("加载失败"); enableGen(); return; }
      var d=r.data; state.current=d; state.plan_id=id;
      $("resTitle").textContent="🗺️ "+(d.title||fallbackTitle||"行程");
      $("boxItinerary").textContent = d.itinerary || "(行程为空)";
      $("exAttr").textContent  = (d.specialists&&d.specialists.attractions)||"(暂无)";
      $("exTrans").textContent = (d.specialists&&d.specialists.transport)||"(暂无)";
      $("exRoute").textContent = (d.specialists&&d.specialists.routing)||"(暂无)";
      $("boxPlan").innerHTML = fmtPlan(d.plan) + "<div style='height:14px'></div>" + fmtEval(d.evaluation);
      $("result").classList.add("show");
      $("resMeta").textContent="生成于 "+fmtTime(d.createdAt);
      if(jump) $("result").scrollIntoView({behavior:"smooth",block:"start"});
      enableGen(); highlightCurrent(id);
    });
  }
  function fmtTime(ts){ var d=new Date(ts||Date.now()); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

  /* ---------- 操作 ---------- */
  function copyItinerary(){
    if(!state.current) return;
    var t=state.current.itinerary||"";
    if(!t){ toast("无可复制内容"); return; }
    (navigator.clipboard?navigator.clipboard.writeText(t):new Promise(function(ok){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); ok(); }))
      .then(function(){ toast("已复制到剪贴板"); },function(){ toast("复制失败"); });
  }
  function download(){
    if(!state.current) return;
    var name=(state.current.title||"行程")+".txt";
    var txt="【"+ (state.current.title||"行程") +"】\n\n"+ (state.current.itinerary||"") +"\n\n—— 景点推荐 ——\n"+((state.current.specialists&&state.current.specialists.attractions)||"")+"\n\n—— 交通方案 ——\n"+((state.current.specialists&&state.current.specialists.transport)||"")+"\n\n—— 路线编排 ——\n"+((state.current.specialists&&state.current.specialists.routing)||"");
    var blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },200);
  }
  function delPlan(){
    if(!state.current) return;
    if(!confirm("确定删除这份行程？此操作不可恢复。")) return;
    api("DELETE","/api/travel/plans/"+encodeURIComponent(state.plan_id)).then(function(r){
      if(r.status!==200){ toast(r.data.error||"删除失败"); return; }
      state.current=null; state.plan_id=null; $("result").classList.remove("show");
      toast("已删除"); loadHistory();
    });
  }

  /* ---------- 历史 ---------- */
  function loadHistory(){
    api("GET","/api/travel/plans").then(function(r){
      if(r.status!==200) return;
      var items=r.data.items||[], total=r.data.total||items.length;
      if(!items.length){ $("hisEmpty").style.display="block"; $("hisTitle").style.display="none"; $("hisList").innerHTML=""; return; }
      $("hisEmpty").style.display="none"; $("hisTitle").style.display="flex"; $("hisCnt").textContent="（"+total+"份）";
      var l=$("hisList"); l.innerHTML="";
      items.forEach(function(it){
        var d=document.createElement("div"); d.className="his-item"; d.style.borderColor=(state.plan_id===it.id)?"var(--brand)":"";
        d.innerHTML='<div class="ic">🧳</div><div class="mid"><div class="t">'+esc(it.title||"未命名行程")+'</div><div class="n">'+fmtTime(it.createdAt)+'</div></div><button class="del" title="删除">🗑</button>';
        d.querySelector(".mid").onclick=function(){ state.plan_id=it.id; if(state.busy) return; $("result").classList.remove("show"); showSteps(); resetSteps(); loadDetail(it.id,true); };
        d.querySelector(".del").onclick=function(ev){ ev.stopPropagation(); if(confirm("确定删除「"+(it.title||"未命名行程")+"」？")){ api("DELETE","/api/travel/plans/"+encodeURIComponent(it.id)).then(function(rr){ if(rr.status===200){ if(state.plan_id===it.id){ state.plan_id=null; state.current=null; $("result").classList.remove("show"); } toast("已删除"); loadHistory(); } }); } };
        l.appendChild(d);
      });
    });
  }
  function highlightCurrent(id){
    var items=$("hisList").querySelectorAll(".his-item");
    for(var i=0;i<items.length;i++){ items[i].style.borderColor=(state.plan_id===id)?"var(--brand)":""; }
  }

  /* ---------- 绑定 ---------- */
  function bindActions(){
    $("genBtn").onclick=gen;
    $("copyBtn").onclick=copyItinerary;
    $("dlBtn").onclick=download;
    $("regenBtn").onclick=regen;
    $("delBtn").onclick=delPlan;
  }

  function init(){
    api("GET","/api/auth/me").then(function(res){
      if(res.status!==200 || !res.data.user){ location.href="index.html"; return; }
      var u=res.data.user; $("who").textContent=(u.displayName||u.username);
      bindResTab(); bindActions(); resetSteps(); loadTools(); loadHistory();
    }).catch(function(){ location.href="index.html"; });
  }
  init();
})();
</script>
</body>
</html>
