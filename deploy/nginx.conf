# ============================================================
# nginx 反向代理 + HTTPS（自签证书，仅本地测试用）
# 应用跑在 127.0.0.1:8787（uvicorn），由 nginx 终止 TLS。
# nginx 设置 X-Forwarded-Proto / X-Forwarded-For，
# 应用据此下发 Secure cookie 和 Strict-Transport-Security。
#
# 说明：证书 deploy/certs/localhost.crt|.key 由 openssl 生成（CN=localhost，
#       SAN=DNS:localhost,IP:127.0.0.1），仅用于本地测试，浏览器会提示“不安全”。
#       生产请替换为受信任证书（ACME/Let's Encrypt 或你的 CA）。
# ============================================================

server {
    listen 8443 ssl;
    server_name localhost;

    # 路径相对于 nginx 启动目录；生产建议改为绝对路径
    ssl_certificate     deploy/certs/localhost.crt;
    ssl_certificate_key deploy/certs/localhost.key;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 透传真实客户端信息（应用据此下发 Secure cookie + HSTS）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8787;
    }
}

# 启动（在项目根目录下执行，使相对证书路径生效）：
#   nginx -c "$(pwd)/deploy/nginx.conf"
# 验证：访问 https://localhost:8443/ ，登录后查看
#       Set-Cookie 应带 Secure 标记，响应头应含 Strict-Transport-Security。
