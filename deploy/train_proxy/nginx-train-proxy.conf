# ============================================================
# 12306 代理 · 反向代理 + HTTPS（生产部署用）
# 放到 /etc/nginx/conf.d/train-proxy.conf 后执行：
#   nginx -t && systemctl reload nginx
# 作用：为 127.0.0.1:8799 的 train_proxy 套上 HTTPS + 域名，并做安全收敛：
#   - 仅允许 GET
#   - 仅暴露 /query 与 /health（其余 404）
#   - 限流（防有人借你的节点狂刷 12306）
#   - 应用层已有 PROXY_TOKEN 鉴权，这里再叠加网络层收敛
# 前提：证书用 certbot 申请（下面路径为示例），或换成你的 CA 证书。
# ============================================================

# 限流：每 IP 每秒 1 次，突发 3
limit_req_zone $binary_remote_addr zone=trainproxy:10m rate=1r/s;

# 80 端口：让 certbot 做 ACME 验证，并 301 跳转到 HTTPS
server {
    listen 80;
    server_name train.your-domain.com;   # 换成你的子域名

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name train.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/train.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/train.your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # 仅允许 GET，其余方法 405
    if ($request_method !~ ^(GET)$) { return 405; }

    # 限流
    limit_req zone=trainproxy burst=3 nodelay;

    # 仅暴露必要路径，其余一律 404
    location = /health {
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /query {
        proxy_pass http://127.0.0.1:8799;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 无头浏览器访问 12306 可能较慢，给足超时
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}

